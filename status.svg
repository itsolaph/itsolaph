<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" xml:space="preserve" role="img" aria-label="olaph status window, a small shadow devil peeking from the corner: class tinkerer, quest log with Frontier Pulse and XDM live, three builds in progress, Close Call cleared">
  <style>
    text { font-family: "Courier New", ui-monospace, monospace; fill: #efe4cf; }
    .lbl { fill: #c9a45c; font-size: 15px; }
    .big { font-size: 30px; font-weight: 700; letter-spacing: 2px; }
    .t { font-size: 17px; }
    .dim { fill: #8a7a66; }
    .ok { fill: #9fd49a; }
    .gold { fill: #e8c06a; }
    .mp { fill: #a98be6; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .eyes { animation: peek 5s steps(1) infinite; }
    @keyframes peek { 0%, 92% { opacity: 1; } 93%, 97% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a211a"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="812" height="272" rx="10" fill="url(#win)" stroke="#c9a45c" stroke-width="3"/>
  <rect x="10" y="10" width="800" height="260" rx="7" fill="none" stroke="#5a4632" stroke-width="1.5"/>

    <text x="34" y="60" class="big">OLAPH</text>
  <text x="34" y="92" class="t"><tspan class="lbl">CLASS </tspan>Tinkerer</text>

  <text x="34" y="140" class="lbl">HP</text>
  <rect x="70" y="128" width="190" height="12" rx="3" fill="#120e0b" stroke="#5a4632"/>
  <rect x="72" y="130" width="186" height="8" rx="2" fill="#9fd49a"/>

  <text x="34" y="170" class="lbl">MP</text>
  <rect x="70" y="158" width="190" height="12" rx="3" fill="#120e0b" stroke="#5a4632"/>
  <rect x="72" y="160" width="52" height="8" rx="2" fill="#8a6bd1"/>
  <text x="270" y="170" class="t dim" style="font-size:13px">needs coffee</text>

  <text x="34" y="222" class="lbl">SKILLS</text>
  <text x="104" y="222" class="t" style="font-size:15px">TS · Python · Kotlin · Solidity</text>

  <line x1="472" y1="30" x2="472" y2="250" stroke="#5a4632" stroke-width="1.5"/>

  <text x="500" y="52" class="lbl">QUEST LOG</text>
  <text x="500" y="86" class="t cursor gold">▶</text>
  <text x="524" y="86" class="t">Frontier Pulse</text>
  <text x="712" y="86" class="t ok">LIVE</text>
  <text x="524" y="113" class="t">XDM</text>
  <text x="712" y="113" class="t ok">LIVE</text>
  <text x="524" y="140" class="t">Shadowright</text>
  <text x="712" y="140" class="t mp">BUILD</text>
  <text x="524" y="167" class="t">Keepalive</text>
  <text x="712" y="167" class="t mp">BUILD</text>
  <text x="524" y="194" class="t">DotGas</text>
  <text x="712" y="194" class="t mp">BUILD</text>
  <text x="524" y="221" class="t">Close Call</text>
  <text x="712" y="221" class="t gold">CLEAR</text>
  <text x="500" y="260" class="t dim" style="font-size:13px">side quest: anime backlog (∞)</text>

  <g transform="translate(756 20) scale(0.82)">
    <path d="M6 22 L2 2 L16 14 Z M44 22 L48 2 L34 14 Z" fill="#050403" stroke="#5a4632" stroke-width="1.2"/>
    <ellipse cx="25" cy="30" rx="22" ry="18" fill="#050403" stroke="#5a4632" stroke-width="1.2"/>
    <path d="M6 46 L2 56 L12 49 Z M44 46 L48 56 L38 49 Z" fill="#050403" stroke="#5a4632" stroke-width="1.2"/>
    <g class="eyes"><circle cx="17" cy="27" r="4" fill="#efe4cf"/><circle cx="33" cy="27" r="4" fill="#efe4cf"/></g>
    <path d="M13 37 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4" stroke="#b8453a" stroke-width="2" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
