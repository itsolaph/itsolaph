<svg xmlns="http://www.w3.org/2000/svg" width="820" height="210" viewBox="0 0 820 210" xml:space="preserve" role="img" aria-label="olaph status window: class tinkerer, quest log with Frontier Pulse live and Close Call cleared">
  <style>
    text { font-family: "Courier New", ui-monospace, monospace; fill: #f4f6ff; }
    .lbl { fill: #9fb3ff; font-size: 15px; }
    .big { font-size: 30px; font-weight: 700; letter-spacing: 2px; }
    .t { font-size: 17px; }
    .dim { fill: #8c96c8; }
    .ok { fill: #8ef0b0; }
    .gold { fill: #ffd76a; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3cb8"/>
      <stop offset="1" stop-color="#0d1352"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="812" height="202" rx="10" fill="url(#win)" stroke="#e8ecff" stroke-width="4"/>
  <rect x="10" y="10" width="800" height="190" rx="7" fill="none" stroke="#6c7be0" stroke-width="1.5"/>

  <text x="34" y="52" class="big">OLAPH</text>
  <text x="34" y="80" class="t"><tspan class="lbl">CLASS </tspan>Tinkerer</text>

  <text x="34" y="116" class="lbl">HP</text>
  <rect x="70" y="104" width="190" height="12" rx="3" fill="#0a0e3a" stroke="#6c7be0"/>
  <rect x="72" y="106" width="186" height="8" rx="2" fill="#8ef0b0"/>

  <text x="34" y="142" class="lbl">MP</text>
  <rect x="70" y="130" width="190" height="12" rx="3" fill="#0a0e3a" stroke="#6c7be0"/>
  <rect x="72" y="132" width="52" height="8" rx="2" fill="#7fb2ff"/>
  <text x="270" y="142" class="t dim" style="font-size:13px">needs coffee</text>

  <text x="34" y="182" class="lbl">SKILLS</text>
  <text x="104" y="182" class="t" style="font-size:15px">TypeScript · Python · Kotlin · cron</text>

  <line x1="472" y1="30" x2="472" y2="180" stroke="#6c7be0" stroke-width="1.5"/>

  <text x="500" y="52" class="lbl">QUEST LOG</text>
  <text x="500" y="88" class="t cursor gold">▶</text>
  <text x="524" y="88" class="t">Frontier Pulse</text>
  <text x="712" y="88" class="t ok">LIVE</text>
  <text x="524" y="118" class="t">Close Call</text>
  <text x="712" y="118" class="t gold">CLEAR</text>
  <text x="524" y="148" class="t dim">???</text>
  <text x="712" y="148" class="t dim">LOCKED</text>
  <text x="500" y="182" class="t dim" style="font-size:13px">side quest: anime backlog (∞)</text>
</svg>
